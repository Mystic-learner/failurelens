services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: failurelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-failurelens}
      POSTGRES_DB: failurelens
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failurelens -d failurelens"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Throwaway database for the integration tests:
  #   docker compose --profile test up -d --wait db-test
  db-test:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: failurelens
      POSTGRES_PASSWORD: failurelens
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failurelens -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://failurelens:${POSTGRES_PASSWORD:-failurelens}@db:5432/failurelens
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_MODEL_DIR: /models/bge-small-en-v1.5
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/models:ro
    stop_grace_period: 40s

  caddy:
    profiles: ["prod"]
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
